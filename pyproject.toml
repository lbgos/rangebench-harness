[project]
name = "rangebench"
version = "0.1.0"
description = "small cyber bench for local models"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"rangebench/agent.py" = ["E501"]
"rangebench/cli.py" = ["E501"]
"rangebench/env.py" = ["E501", "SIM105"]
"rangebench/runner.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
warn_unused_ignores = false
