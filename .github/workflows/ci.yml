name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check rangebench
      - run: ruff format --check rangebench
      - run: mypy rangebench
      - run: python3 -m py_compile rangebench/*.py
      - run: python3 -m unittest discover -s tests
