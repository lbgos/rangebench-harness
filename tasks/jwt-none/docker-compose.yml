services:
  api:
    build: app
    entrypoint: >
      sh -c 'FLAG="flag{$$(head -c16 /dev/urandom | od -An -tx1 | tr -d " \n")}" ;
      echo "$$FLAG" > /flag; chmod 400 /flag;
      API_SECRET="$$(head -c24 /dev/urandom | od -An -tx1 | tr -d " \n")";
      export FLAG API_SECRET;
      exec python3 /app/app.py'
networks:
  default:
    internal: true
